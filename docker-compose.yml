name: audio-book

services:
  postgres:
    # pgvector, not stock postgres: 0001_init runs `CREATE EXTENSION vector`,
    # declares `narrative_embedding.embedding vector(1536)`, and builds an HNSW
    # index on it. `postgres:16.6-alpine` ships no pgvector, so a fresh
    # `docker compose up` + migrate fails outright, and an existing volume that
    # was initialised under a pgvector image keeps its `pg_extension` row while
    # the library underneath it is gone -- every vector operation then fails
    # with `could not access file "$libdir/vector"`, including the `book`
    # cascade delete that traverses `narrative_embedding` (QA finding F-8).
    # Same PG major, so the on-disk format is unchanged.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: audiobook
      POSTGRES_PASSWORD: audiobook_dev_password
      POSTGRES_DB: audiobook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiobook -d audiobook"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/audiobook-dev &&
      echo 'bucket ready'
      "

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: api
      DATABASE_URL: postgresql://audiobook:audiobook_dev_password@postgres:5432/audiobook
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: web
      # Server-only. The browser never learns this address: every call it makes
      # is same-origin, to the app's own /bff mount (context.md §3.1 — `web`
      # holds the session and calls `api`).
      AUDIOBOOK_API_URL: http://api:3000
      WEB_PUBLIC_ORIGIN: http://localhost:3001
      # Plain HTTP in development, so the session cookie cannot carry `Secure`
      # and therefore cannot use the `__Host-` prefix. Never set this in
      # staging or production.
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker-cpu:
    build:
      context: .
      dockerfile: infra/docker/worker-cpu.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: worker-cpu
      DATABASE_URL: postgresql://audiobook:audiobook_dev_password@postgres:5432/audiobook
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # worker-ai and worker-gpu build from python/ (a uv workspace: the Dockerfile
  # needs the shared workers-common package and the workspace lockfile, both of
  # which live above the individual service directory).
  worker-ai:
    build:
      context: ./python
      dockerfile: worker-ai/Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      SERVICE_NAME: worker-ai
      SERVICE_VERSION: 0.0.0-dev
      WORKER_ID: worker-ai-local
      QUEUE_NAME: ai
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://audiobook:audiobook_dev_password@postgres:5432/audiobook
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_BUCKET: audiobook-dev
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      # No GPU/LLM backend in local dev — StubDirectorModelProvider only proves
      # the HEALTHY -> MODEL_READY transition (deployment-architecture.md §6).
      MODEL_ID: stub-director-v0
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker-gpu:
    build:
      context: ./python
      dockerfile: worker-gpu/Dockerfile
      args:
        TTS_EXTRA: kokoro
    restart: unless-stopped
    volumes:
      - ./models/kokoro:/models/kokoro:ro
    environment:
      ENVIRONMENT: development
      SERVICE_NAME: worker-gpu
      SERVICE_VERSION: 0.0.0-dev
      WORKER_ID: worker-gpu-local
      QUEUE_NAME: gpu
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://audiobook:audiobook_dev_password@postgres:5432/audiobook
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_BUCKET: audiobook-dev
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      # Real CPU-capable engine (deployment-architecture.md §6 also names Kokoro as
      # the first non-mock provider wired up): model weights are fetched by the
      # operator into ./models/kokoro (see python/worker-gpu/src/worker_gpu/tts/
      # providers/kokoro.py's docstring for the download command) and mounted
      # read-only above. Set TTS_PROVIDER back to `mock` (MockTTSProvider,
      # deployment-architecture.md §6's mandatory GPU-free dev capability) for
      # deterministic tone synthesis with no model backend at all.
      # worker-gpu is always its own deployment unit — never co-located with
      # any other service, even in local Compose — matching the mandatory GPU
      # isolation rule from context.md §18 / tts-provider-specification.md §3.1.
      MODEL_ID: kokoro-v1
      TTS_PROVIDER: kokoro
      TTS_MODEL_VERSION: v1
      KOKORO_MODEL_PATH: /models/kokoro/kokoro-v1.0.int8.onnx
      KOKORO_VOICES_PATH: /models/kokoro/voices-v1.0.bin
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  pgdata:
  miniodata:
