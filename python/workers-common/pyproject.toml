[project]
name = "workers-common"
version = "0.1.0"
description = "Shared infrastructure for the Python workers (config, logging, queue, db, storage, health)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "bullmq>=2.11",
    "redis>=5.2",
    "boto3>=1.35",
    "uuid6>=2024.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workers_common"]
