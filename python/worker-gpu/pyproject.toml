[project]
name = "worker-gpu"
version = "0.1.0"
description = "TTS worker. Consumes the `gpu` queue. GPU-isolated."
requires-python = ">=3.12,<3.13"
dependencies = [
    "workers-common",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
]
# `mock` (the default `TTS_PROVIDER`) has no model/GPU dependency at all -- it is the
# CI/local-dev provider `deployment-architecture.md` §6 makes mandatory. The `kokoro`
# extra below is what pulls in a real (CPU-runnable) engine; nothing in the base
# dependency set assumes CUDA or any specific inference runtime.

[project.optional-dependencies]
kokoro = [
    "kokoro-onnx>=0.3",
]

[project.scripts]
worker-gpu = "worker_gpu.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_gpu"]

[tool.uv.sources]
workers-common = { workspace = true }
